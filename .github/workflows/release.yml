name: Release

# Run manually from a tag named `@tumaet/ui-react@<version>` (see RELEASING.md).
# The tarball is built and tested once, then the same bytes are staged on npm.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist tag (prereleases must use a non-latest tag)'
        required: true
        default: next
        type: choice
        options: [next, alpha, beta, rc, latest]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ls1intum/tum-aet-ui-react'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.artifact.outputs.filename }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      node: ${{ steps.artifact.outputs.node }}
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate release identity
        id: identity
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { validateRelease } from './scripts/release-policy.mjs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const distTag = validateRelease({ name, version, refType: process.env.RELEASE_REF_TYPE, ref: process.env.RELEASE_REF, distTag: process.env.RELEASE_DIST_TAG });
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          NODE
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:check
      - name: Record immutable artifact
        id: artifact
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { filename, integrity } = JSON.parse(readFileSync('build/package/manifest.json', 'utf8'));
          const node = readFileSync('.nvmrc', 'utf8').trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\nintegrity=${integrity}\nnode=${node}\n`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: build/package/
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        peers: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: build/package
      - run: node scripts/consumer/run.mjs ${{ matrix.peers }}

  stage:
    needs: [build, consumer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-tum-aet-ui-react
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep package code out of the credentialed job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifact
      - name: Verify and stage the tested tarball
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          PACKAGE_INTEGRITY: ${{ needs.build.outputs.integrity }}
          PACKAGE_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync(`artifact/${process.env.PACKAGE_FILE}`);
          assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`, process.env.PACKAGE_INTEGRITY);
          assert.ok(['latest', 'next', 'alpha', 'beta', 'rc'].includes(process.env.PACKAGE_DIST_TAG));
          NODE
          npm stage publish "./artifact/$PACKAGE_FILE" --ignore-scripts --access public --tag "$PACKAGE_DIST_TAG"
          echo "Review the staged TUM AET UI for React package on npm (dist tag: $PACKAGE_DIST_TAG) and approve it with 2FA to complete publication." >> "$GITHUB_STEP_SUMMARY"
